# Anti-lazy agent: don't terminate on fall, penalize standing still, start in motion
# Fixes: no terminate_on_leg_up (lifting legs is required for walking), imitation reward, joint vel obs, larger net.
# See LAZY_AGENT_FIXES.md.
env:
  xml_path: "assets/hexapod.xml"
  frame_skip: 5
  max_episode_steps: 1000
  obs_use_sensors: false
  obs_include_joint_pos: true
  obs_include_joint_vel: true   # Policy needs leg swing velocity to plan; was false ("blindness")
  obs_include_torso_quat: false
  obs_include_torso_vel: true
  obs_include_contact: false
  obs_include_prev_action: true
  obs_include_phase: true
  obs_phase_frequency_hz: 0.9
  use_pd_control: true
  pd_kp: 20.0
  pd_kd: 1.0
  pd_steps_per_action: 10
  action_use_joint_limits: false
  action_scale_abd_deg: 35.0
  action_scale_flex_deg: 60.0
  min_torso_height: 0.05
  max_torso_tilt: 45
  max_flexion_angle: 70
  action_smooth_alpha: 0.0
  target_torso_height: 0.10
  action_warmup_steps: 0
  # Anti-lazy: do not end episode on fall; robot can writhe and recover
  terminate_on_fall: false
  terminate_on_tilt: false     # Was true: tilt > 45 deg ended episode in ~35 steps ("tilt death trap"); use tilt_penalty instead
  terminate_on_leg_up: false   # Lifting legs is required for walking; true was a "death trap" (mean_ep_len ~36)
  # Start with larger joint noise and a small forward shove so it must react
  reset_joint_noise_scale: 0.25
  reset_initial_forward_velocity: 0.15

reward:
  imitation_weight: 0.2       # Reduced so velocity reward dominates; was 0.5 (plan: avoid over-matching reference)
  imitation_frequency_hz: 0.9
  imitation_amp_flex: 0.4
  imitation_amp_abd: 0.25
  imitation_action_mix: 0.0
  imitation_flex_sign: -1.0
  imitation_abd_sign: 1.0
  forward_distance_weight: 0.0
  forward_velocity_weight: 50.0
  velocity_reward_window: 1   # Instantaneous velocity reward (plan: no lag/smoothing)
  idle_velocity_threshold: 0.03
  idle_velocity_penalty_weight: 1.5   # Stronger stand-still penalty (plan: was 0.5)
  stall_penalty_threshold: 0.08
  stall_penalty_weight: 1.0   # Extra penalty when avg velocity below threshold (plan)
  smoothness_reward_weight: 0.0
  stability_reward_weight: 0.0
  survival_bonus: 0.0
  backward_penalty_weight: 0.0
  lateral_velocity_penalty_weight: 1.0
  height_penalty_weight: 0.0
  height_penalty_threshold: 0.06
  tilt_penalty_weight: 2.0    # Per-step penalty for tilt (rad); keeps learning signal without ending episode
  # When not terminating on fall, penalize being below min height each step
  fall_penalty_weight: 2.0

scpg:
  use_tripod_gait: true
  neurons_per_oscillator: 32
  tau_mem: 20.0
  tau_syn: 10.0
  num_timesteps: 10

ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.03   # Higher to prevent policy entropy collapse (plan: was 0.01)
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [256, 256]   # Larger capacity for 12-DOF + phase; was [64, 64]
      vf: [256, 256]

training:
  total_timesteps: 1000000   # 1M steps recommended for hexapod gait from scratch (was 300k)
  eval_freq: 10000
  n_eval_episodes: 5
  save_freq: 50000
  log_interval: 10
  seed: 42
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  imitation_action_mix_start: 0.0
  imitation_action_mix_end: 0.0
  imitation_action_mix_decay_steps: 0
  imitation_action_mix_eval: 0.0

evaluation:
  num_episodes: 10
  render: true
  save_video: true
  video_dir: "videos"
