# BNO086-like IMU-only training (10D): accel(3) + gyro(3) + fused quaternion(4).
# Closest to a single SparkFun BNO08x-class IMU while keeping 12-DoF control.

env:
  observation_mode: imu_bno10
  imu_noise_std_accel: 0.03
  imu_noise_std_gyro: 0.008
  imu_noise_std_quat: 0.01
  action_rate_limit: 0.15
  action_scale_abd_deg: 42.0
  action_scale_flex_deg: 72.0
  action_smooth_alpha: 0.2
  action_use_joint_limits: false
  action_warmup_steps: 0
  frame_skip: 6
  max_episode_steps: 1000
  max_flexion_angle: 88
  max_torso_tilt: 45
  min_torso_height: 0.05
  obs_include_contact: false
  obs_include_joint_pos: false
  obs_include_joint_vel: false
  obs_include_path_heading_error: false
  obs_include_phase: false
  obs_include_prev_action: false
  obs_include_torso_quat: false
  obs_include_torso_vel: false
  obs_use_sensors: false
  path_type: null
  pd_kd: 1.25
  pd_kp: 20.0
  pd_steps_per_action: 10
  reset_initial_forward_velocity: 0.06
  reset_joint_noise_scale: 0.25
  target_torso_height: 0.1
  terminate_on_fall: false
  terminate_on_leg_up: false
  terminate_on_tilt: false
  use_pd_control: true
evaluation:
  num_episodes: 5
  render: false
  save_video: false
  video_dir: videos
ppo:
  batch_size: 64
  clip_range: 0.2
  ent_coef: 0.06
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0003
  max_grad_norm: 0.5
  n_epochs: 10
  n_steps: 2048
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]
  use_mlp_policy: true
  vf_coef: 0.5
reward:
  backward_penalty_weight: 0.0
  fall_penalty_weight: 2.0
  forward_distance_weight: 0.0
  forward_velocity_weight: 14.0
  height_penalty_threshold: 0.06
  height_penalty_weight: 0.0
  idle_velocity_penalty_weight: 2.0
  idle_velocity_threshold: 0.02
  imitation_abd_sign: 1.0
  imitation_action_mix: 0.0
  imitation_amp_abd: 0.25
  imitation_amp_flex: 0.4
  imitation_flex_sign: -1.0
  imitation_frequency_hz: 0.45
  imitation_weight: 0.0
  jerk_penalty_weight: 0.08
  joint_velocity_penalty_weight: 0.03
  lateral_velocity_penalty_weight: 1.0
  path_heading_reward_weight: 0.0
  path_proximity_reward_weight: 0.0
  path_proximity_tolerance: 0.1
  smoothness_reward_weight: 0.5
  stability_reward_weight: 1.0
  stall_penalty_threshold: 0.05
  stall_penalty_weight: 0.5
  stance_action_penalty_weight: 0.05
  stance_stability_penalty_weight: 0.05
  survival_bonus: 0.0
  target_forward_velocity: 0.09
  target_velocity_scale: 0.12
  target_velocity_weight: 24.0
  tilt_penalty_weight: 2.0
  velocity_reward_window: 7
  yaw_rate_penalty_weight: 1.0
scpg:
  neurons_per_oscillator: 32
  num_timesteps: 10
  tau_mem: 20.0
  tau_syn: 10.0
  use_tripod_gait: true
training:
  checkpoint_dir: checkpoints
  eval_freq: 10000
  imitation_action_mix_decay_steps: 0
  imitation_action_mix_eval: 0.0
  imitation_action_mix_end: 0.0
  imitation_action_mix_start: 0.0
  log_dir: logs
  log_interval: 10
  n_eval_episodes: 3
  save_freq: 50000
  seed: 43
  total_timesteps: 300000
