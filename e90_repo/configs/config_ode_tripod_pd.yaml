# ODE-style tripod gait: phase theta = 2*pi*f*sim_time + phi(obs); PPO tunes f, amps, residual.
# Phase is reconstructed from env sim time (last obs dim) so PPO evaluate_actions matches rollouts.
#
# Train (artifacts under runs/):
#   python train.py --config configs/config_ode_tripod_pd.yaml --output-dir runs/ode_gait_001
#
# Physics clock per RL step: pd_steps_per_action * mj_model.opt.timestep (must match env _sim_time).
# Default: 5 * 0.002 = 0.01 s per env step (same as other PD configs).

env:
  xml_path: "assets/hexapod.xml"
  frame_skip: 5
  max_episode_steps: 1000
  obs_use_sensors: false
  obs_include_joint_pos: true
  obs_include_joint_vel: false
  obs_include_torso_quat: false
  obs_include_torso_vel: true
  obs_include_contact: false
  obs_include_prev_action: true
  obs_include_phase: false
  obs_phase_frequency_hz: 0.9
  obs_include_sim_time: true
  use_pd_control: true
  pd_kp: 8.0
  pd_kd: 0.5
  pd_steps_per_action: 5
  action_use_joint_limits: false
  action_scale_abd_deg: 20.0
  action_scale_flex_deg: 35.0
  min_torso_height: 0.05
  max_torso_tilt: 40
  max_flexion_angle: 55
  action_smooth_alpha: 0.0
  target_torso_height: 0.10
  action_warmup_steps: 0

reward:
  imitation_weight: 0.0
  imitation_frequency_hz: 0.9
  imitation_amp_flex: 0.4
  imitation_amp_abd: 0.25
  imitation_action_mix: 0.0
  imitation_flex_sign: -1.0
  imitation_abd_sign: 1.0
  forward_distance_weight: 8.0
  forward_velocity_weight: 20.0
  idle_velocity_threshold: 0.03
  idle_velocity_penalty_weight: 0.0
  smoothness_reward_weight: 0.0
  stability_reward_weight: 0.0

scpg:
  use_tripod_gait: false

ppo:
  use_ode_tripod_policy: true
  ode_tripod:
    sim_time_in_obs: true
    freq_hz_range: [0.35, 1.6]
    max_amp_flex: 0.95
    max_amp_abd: 0.95
    flex_sign: -1.0
    abd_sign: 1.0
    residual_scale: 0.2
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch:
      pi: [64, 64]
      vf: [64, 64]

training:
  total_timesteps: 300000
  eval_freq: 10000
  n_eval_episodes: 5
  save_freq: 50000
  log_interval: 10
  seed: 42
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  imitation_action_mix_start: 0.0
  imitation_action_mix_end: 0.0
  imitation_action_mix_decay_steps: 0
  imitation_action_mix_eval: 0.0

evaluation:
  num_episodes: 10
  render: true
  save_video: true
  video_dir: "videos"
